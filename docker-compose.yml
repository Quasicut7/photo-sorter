# Simple Docker Compose - Run all services with one command
# Usage: docker-compose up

version: '3.8'

services:
  # Backend API (Node.js + Express)
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - AI_SERVICE_URL=http://ai-service:8000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - ai-service

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # AI Service (Python + FastAPI)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: ../docker/ai-service.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHON_ENV=development
    env_file:
      - ./ai-service/.env
    volumes:
      - ./ai-service:/app
